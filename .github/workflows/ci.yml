name: CI

on:
  push:
    branches: [main, s1, s2, s3]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (compiles packages; the stdio test runs the compiled binary)
        run: pnpm build
      - name: Build the dashboard
        run: pnpm build:dashboard
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Demo agents, scripted, against the demo proxy (exit 1 if any expectation fails)
        run: pnpm --filter @payleash/demo-agents start -- --fast --port 8791
      - name: Browser tests (axe on every page in light, dark and at 375 px; mobile approval flow)
        run: pnpm test:e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Seed script without credentials must exit 0
        run: pnpm seed
        env:
          PAYPAL_CLIENT_ID: ""
          PAYPAL_CLIENT_SECRET: ""
